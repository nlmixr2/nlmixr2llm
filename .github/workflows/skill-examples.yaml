# Runs the fenced R code blocks shipped in inst/agents and inst/skills against
# the current CRAN releases of the nlmixr2 ecosystem (see
# tests/testthat/test-examples.R). Kept out of the R-CMD-check matrix because it
# fits real models and needs the whole modeling stack installed. The weekly
# schedule is the point: it catches upstream API drift that would otherwise
# only surface when an LLM writes broken code from these snippets. Blocks in
# `example_slow` are skipped here and run weekly by slow-examples.yaml.
on:
  push:
    branches: [main, master]
    paths:
      - 'inst/agents/**'
      - 'inst/skills/**'
      - 'tests/testthat/helper-examples.R'
      - 'tests/testthat/test-examples.R'
      - '.github/workflows/skill-examples.yaml'
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

name: skill-examples.yaml

permissions: read-all

jobs:
  skill-examples:
    if: ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged')) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # statuses: write lets a /ci run report back to the PR
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: write
    runs-on: ubuntu-latest
    name: skill code examples (ubuntu, R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      NLMIXR2LLM_RUN_EXAMPLES: true

    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: skill code examples (ubuntu, R release)
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-pandoc@v2   # ggPMX::pmx_report() renders R Markdown

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # The modeling stack is deliberately not in DESCRIPTION (the package has
      # no runtime dependency on it); install it here for this job only.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::withr
            any::rxode2
            any::units
            any::nlmixr2
            any::nlmixr2est
            any::nlmixr2data
            any::nlmixr2plot
            any::nlmixr2lib
            any::nlmixr2extra
            any::nlmixr2rpt
            any::onbrand
            any::xpose.nlmixr2
            any::xpose
            any::ggPMX
            any::lbfgsb3c
            any::nlmixr2autoinit
            any::nlmixr2auto
            github::nlmixr2/nlmixr2nn
            any::nonmem2rx
            any::monolix2rx
            any::babelmixr2
            any::PopED
            any::dplyr
            any::tidyr

      - name: Run the skill code examples
        run: |
          Rscript -e '
            res <- testthat::test_local(filter = "examples", reporter = "progress",
                                        stop_on_failure = FALSE)
            df <- as.data.frame(res)
            cat(sprintf("\n%d blocks: %d passed, %d failed, %d skipped\n",
                        nrow(df), sum(df$passed > 0 & df$failed == 0 & !df$skipped),
                        sum(df$failed > 0 | df$error), sum(df$skipped)))
            if (any(df$failed > 0 | df$error)) quit(status = 1)
          '

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: skill code examples (ubuntu, R release)
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
